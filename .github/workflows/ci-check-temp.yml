name: CI check (temporary)
on:
  push:
    branches: ['ci-check/**']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/features/personal lib/features/buddy lib/features/squad/presentation
      - run: flutter test
