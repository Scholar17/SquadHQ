# Push to main → test, apply new Supabase migrations, then build the
# Flutter web app and deploy it to Firebase Hosting (target "app",
# squad-hq.web.app). A failed test or migration stops the deploy, so the
# app never goes out ahead of its database.
#
# Migrations: each new supabase/migrations/*.sql runs once on the live
# project (.github/scripts/apply-migrations.sh has the rules).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN     a Supabase personal access token with
#                             Database read + write
#   ENV_FILE                  the whole local .env file (dart defines; without
#                             it the live app is a white screen)
#   FIREBASE_SERVICE_ACCOUNT_MY_PROJECT_1542101276805  service account JSON key
#                             (uploaded by `firebase init hosting:github`)
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, never cancelled midway (that could stop a migration
# halfway): a newer push waits, and only the latest waiting run is kept.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Apply new Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qqcflvbuuxtzoysiawie
        run: .github/scripts/apply-migrations.sh

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env
          grep -q '^SUPABASE_URL=' .env || { echo "::error::ENV_FILE has no SUPABASE_URL"; exit 1; }

      - name: Build web
        run: flutter build web --release --dart-define-from-file=.env

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PROJECT_1542101276805 }}
          projectId: my-project-1542101276805
          target: app
          channelId: live
