<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Phone-sized from the first frame, as Flutter sets it once it starts:
       without it the splash below draws zoomed out, then jumps in size. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Squad HQ — the money and time manager for your squad: plan matches and trips, split bills and subscriptions, see who owes what, and settle up.">

  <!-- Link previews (LINE, Messenger, WhatsApp, Telegram, X …). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Squad HQ">
  <meta property="og:title" content="Squad HQ — your squad's money &amp; time, sorted">
  <meta property="og:description" content="Squad HQ — the money and time manager for your squad: plan matches and trips, split bills and subscriptions, see who owes what, and settle up.">
  <meta property="og:url" content="https://squad-hq.web.app/">
  <meta property="og:image" content="https://squad-hq.web.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Squad HQ — your squad's money &amp; time, sorted">
  <meta name="twitter:description" content="Squad HQ — the money and time manager for your squad: plan matches and trips, split bills and subscriptions, see who owes what, and settle up.">
  <meta name="twitter:image" content="https://squad-hq.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Opens the Home Screen icon as a full-screen app on iPhone/iPad — web
       push only works there (iOS 16.4+), not in browser tabs. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Squad HQ">
  <link rel="apple-touch-icon" href="icons/Icon-apple-touch-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Squad HQ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background: #F5EAD8;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5EAD8;
    }
    /* The runner, as WarmUpAnimation lays it out (lib/core/splash). */
    #splash .runner {
      width: 130px;
      height: 130px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="runner" id="splash-runner"></div>
  </div>
  <!-- The app's warm-up animation, until Flutter starts and shows its own
       copy (assets/lottie/runner.json). Without the player, just the
       background. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
  <script>
    if (window.lottie) {
      lottie.loadAnimation({
        container: document.getElementById('splash-runner'),
        renderer: 'svg',
        loop: true,
        autoplay: !matchMedia('(prefers-reduced-motion: reduce)').matches,
        path: 'assets/assets/lottie/runner.json',
      });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Chrome's install offer, kept for Profile → "Install app" (it can
       arrive before Flutter has loaded). preventDefault stops Chrome showing
       its own install banner as well — otherwise there are two prompts to
       dismiss. -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById('splash').remove();
      }
    });
  </script>
</body>
</html>
